name: Validate Repo Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "./docs" ]; then
            echo "/docs folder missing!"
            exit 1
          fi

      - name: Verify required files exist
        run: |
          for file in ERD.png endpoint-plan.md schema.sql; do
            if [ ! -f "./docs/$file" ]; then
              echo "$file missing in /docs!"
              exit 1
            fi
          done
          echo "All required files present "
